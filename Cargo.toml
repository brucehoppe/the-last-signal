[package]
name = "the-last-signal"
version = "0.1.0"
edition = "2021"
description = "An original expedition roguelike with a local AI companion"
license = "MIT"
default-run = "the-last-signal"

[dependencies]
macroquad = { version = "=0.4.16", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "=2.12.1", default-features = false, features = ["json"] }
tempfile = "3"


[profile.release]
lto = true
codegen-units = 1
strip = true
